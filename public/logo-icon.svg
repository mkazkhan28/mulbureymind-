<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Tooth with brain pattern -->
  <g transform="translate(10, 6)">
    <path d="M22 4 C15 4 10 9 10 15 C10 20 11.5 24 13 29 C14.5 34 15.5 40 18 40 C20.5 40 21 35 22 35 C23 35 23.5 40 26 40 C28.5 40 29.5 34 31 29 C32.5 24 34 20 34 15 C34 9 29 4 22 4 Z" fill="url(#iconG)" opacity="0.95"/>
    <!-- Neural network inside -->
    <circle cx="17" cy="15" r="2" fill="white" opacity="0.9"/>
    <circle cx="22" cy="11" r="2" fill="white" opacity="0.9"/>
    <circle cx="27" cy="15" r="2" fill="white" opacity="0.9"/>
    <circle cx="19" cy="21" r="1.6" fill="white" opacity="0.7"/>
    <circle cx="25" cy="21" r="1.6" fill="white" opacity="0.7"/>
    <circle cx="22" cy="27" r="1.4" fill="white" opacity="0.5"/>
    <line x1="17" y1="15" x2="22" y2="11" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="22" y1="11" x2="27" y2="15" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="17" y1="15" x2="19" y2="21" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="27" y1="15" x2="25" y2="21" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="19" y1="21" x2="22" y2="27" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="25" y1="21" x2="22" y2="27" stroke="white" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- MM letters at bottom -->
  <text x="32" y="62" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#c084fc" text-anchor="middle" letter-spacing="1">MM</text>
</svg>
